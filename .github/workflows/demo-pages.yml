name: demo-pages

# Builds the static, backend-less portfolio demo of Atlas (apps/frontend,
# NEXT_PUBLIC_DEMO=true → in-browser mock API + fake company data) and deploys
# it to GitHub Pages at https://atlas.creations.ren (custom domain via the
# CNAME file the build writes into the artifact).
#
# One-time repo setup: Settings → Pages → Source = "GitHub Actions", custom
# domain = atlas.creations.ren (DNS: CNAME atlas → shirasakaren.github.io).

on:
  push:
    branches: ["main"]
    paths:
      - "apps/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/demo-pages.yml"
  pull_request:
    branches: ["*"]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false --filter @atlas/frontend...

      - name: Typecheck
        run: pnpm --filter @atlas/frontend typecheck

      - name: Build static demo
        run: pnpm --filter @atlas/frontend build:demo
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEMO_DOMAIN: atlas.creations.ren

      - name: Verify export
        working-directory: apps/frontend/dist-demo
        run: |
          set -e
          test -f index.html
          test -f 404.html
          test -f login.html
          test -f dashboard.html
          test -f CNAME && grep -qx 'atlas.creations.ren' CNAME
          test -f .nojekyll
          test -f 'projects/_.html'
          du -sh .
          find . -type f | wc -l

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/frontend/dist-demo

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Smoke test the deployment
        run: |
          set -e
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url" || true)
            [ "$code" = "200" ] && echo "OK ($code)" && exit 0
            echo "attempt $i: HTTP $code"; sleep 10
          done
          exit 1
