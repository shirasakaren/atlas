name: ci-backend

on:
  pull_request:
    branches: ["*"]
    paths:
      - "apps/backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ci-backend.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check (name is part of the branch-protection contract — do not rename).
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false --filter @atlas/backend...

      - name: Generate Prisma client
        run: pnpm --filter @atlas/backend prisma:generate

      - name: Lint
        run: pnpm --filter @atlas/backend lint

      - name: Build
        run: pnpm --filter @atlas/backend build

      - name: Test (with coverage gate)
        run: pnpm --filter @atlas/backend exec jest --coverage

      - name: Upload coverage (audit)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: apps/backend/coverage/
          retention-days: 90

  # Integration tests against a real Postgres. Not yet a required check;
  # ratcheted in after a green streak.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Real DB; everything else is dummy — the e2e never reaches Keycloak/S3/Redis.
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_e2e?schema=public
      NODE_ENV: test
      APP_BASE_URL: http://localhost:3000
      API_GLOBAL_PREFIX: api
      KEYCLOAK_BASE_URL: http://localhost:8080
      KEYCLOAK_REALM: test
      KEYCLOAK_CLIENT_ID: atlas-test
      KEYCLOAK_ISSUER: http://localhost:8080/realms/test
      KEYCLOAK_JWKS_URI: http://localhost:8080/realms/test/protocol/openid-connect/certs
      BOOTSTRAP_ADMIN_EMAIL: admin@labmgm.org
      AWS_REGION: ap-southeast-3
      AWS_S3_BUCKET: dummy
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      N8N_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_SECRET: dummy
      INTERNAL_JWT_SECRET: dummy-internal-secret
      # Required by env validation (config/env.validation.ts); throwaway value.
      GODMODE_PASSPHRASE: dummy-godmode-passphrase
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false --filter @atlas/backend...

      - name: Generate Prisma client
        run: pnpm --filter @atlas/backend prisma:generate

      # The migrations were consolidated into a single dependency-ordered
      # `0_init` migration when the apps merged into this monorepo, so a
      # plain `migrate deploy` is safe on a fresh database (the old bare
      # numeric prefixes no longer exist to mis-sort).
      - name: Build schema on the test DB
        run: pnpm --filter @atlas/backend prisma migrate deploy

      - name: e2e tests
        run: pnpm --filter @atlas/backend test:e2e
